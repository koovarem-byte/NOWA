<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>NOVA</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0f1115;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            text-align:center;
        }

        h1{
            font-size:72px;
            margin-bottom:15px;
            color:#0A84FF;
        }

        p{
            font-size:22px;
            color:#b0b0b0;
            margin-bottom:40px;
        }

        a{
            display:inline-block;
            margin:10px;
            padding:16px 40px;
            background:#0A84FF;
            color:white;
            text-decoration:none;
            border-radius:12px;
            font-size:20px;
            transition:0.2s;
        }

        a:hover{
            background:#006be0;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>NOVA</h1>

    <p>Социальная сеть нового поколения</p>

    <a href="/login">Войти</a>

    <a href="/register">Регистрация</a>

</div>

</body>

</html>
