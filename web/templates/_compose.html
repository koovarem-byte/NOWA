<form class="card compose" method="post" action="{{ url_for('new_post') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <textarea name="text" rows="3" maxlength="2000" placeholder="Что нового, {{ me.username }}?" required></textarea>
    <div class="row">
        <label class="muted"><input type="checkbox" name="visibility" value="circle"> 🔒 Только близкий круг</label>
        <button class="btn">Опубликовать</button>
    </div>
</form>
