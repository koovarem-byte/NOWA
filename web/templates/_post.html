<article class="card post" id="post-{{ post.id }}">
    <header>
        <a class="author" href="{{ url_for('profile', username=post.author.username) }}">
            <span class="avatar">{{ post.author.username[0]|upper }}</span>
            {{ post.author.username }}
        </a>
        <a class="muted" href="{{ url_for('view_post', post_id=post.id) }}">{{ post.created_at|ago }}{% if post.edited_at %} · изменён{% endif %}</a>
        {% if post.visibility == 'circle' %}<span class="tag" title="Видит только близкий круг">🔒 круг</span>{% endif %}
    </header>
    <p class="text">{{ post.text }}</p>
    <footer>
        <form method="post" action="{{ url_for('like_post', post_id=post.id) }}" class="like-form">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="action {% if post.id in liked %}liked{% endif %}">
                <span class="heart">{% if post.id in liked %}❤️{% else %}🤍{% endif %}</span>
                <span class="count">{{ post.likes|length }}</span>
            </button>
        </form>
        <a class="action" href="{{ url_for('view_post', post_id=post.id) }}#comments">💬 {{ post.comments|length }}</a>
        {% if me and me.id == post.author_id %}
            <a class="action" href="{{ url_for('edit_post', post_id=post.id) }}">✏️</a>
        {% endif %}
    </footer>
</article>
